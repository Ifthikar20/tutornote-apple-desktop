<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tutornote tutor</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src 'self' file:; img-src 'self' file:" />
    <style>
      /*
        The desktop companion's blob (src/main/companion.ts): the student's own tutor, the very one
        that hops out and follows the cursor, floating on its own over every app and every Space,
        smiling and giggly, with no ring and no picture behind it (the founder, 2026-11-15: "just
        use Sprout ... floating ... smiley, giggly"; 2026-11-17: "fix the part where this is a
        different icon from what follows your cursor"). Which tutor that is, the web app says (its
        tutorLook, kept by src/main/blobTutor.ts). Every tutor a student can have is below, drawn
        from the web app at the bundled commit in its 3D look, one <template> each between the
        blob-tutor markers (scripts/static-tutors.mjs writes them, and their stylesheet), and the
        one main names in blob:state is shown, drawn as the cursor's is: 48 points, breathing,
        blinking and glancing about, with the light rim it has when the app is dark.

        It bobs gently in place and has moods (a smile, a wink, a giggle, a heart: see Moods below,
        each the tutor's own face); it giggles when the pointer comes over it and waves as it lands
        back home. It shows while the tutor is off (resting, or blocked); a click turns the tutor on
        (it hops out and follows the cursor) and the blob goes, the lesson page's dock (its pause and
        x) being the control while it is on. With a page too old to have that dock, the tutor stays,
        faded with a soft glow, and a click on it turns the tutor off. A drag moves it (the app moves
        the window, so the click is never lost to a drag region); a right click shows its menu
        (Close and the tutor's name). Over it, its label shows beside it, in the room the app gives
        the window for it on the side with more space.

        Looks: resting (the tutor floating), on (faded with a glow: as it hops out, as it flies home,
        and with an older page), reading (curious, while a window is being read on this machine),
        blocked (a small "!": screen reading is off), hidden (fading out as the tutor turns on,
        before the app hides the window).
      */
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
        font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      .blob { position: absolute; top: 0; left: 0; width: 64px; height: 64px; touch-action: none; }
      body.side-left .blob { left: auto; right: 0; }
      /* All the blob shows, in one box: a little bigger under the pointer, a little smaller pressed. */
      .stage { position: absolute; inset: 0; transition: transform .16s ease; }
      .blob:hover .stage { transform: scale(1.06); }
      body.held .blob .stage { transform: scale(.95); }
      /* With the app, nothing shows until main has said how to look and which tutor, so another
         tutor never flashes by first. */
      body.waiting .stage { visibility: hidden; }

      /* The tutor: 48 points, the cursor's own size (the web app's POINTER_AVATAR_PX, so the same
         drawing), centred where the cursor's hops out of and lands (the blob's middle). */
      .face-tutor {
        position: absolute; left: 8px; top: 8px; width: 48px; height: 48px; pointer-events: none;
        transform-origin: 50% 90%; transition: opacity .2s ease, transform .3s cubic-bezier(.2, .9, .3, 1.2);
      }
      /* Floating: a slow bob, the whole of it. */
      .float { position: absolute; inset: 0; animation: float 3.2s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      /* The sparkle and the "!" over it (a little inside the window, as the tutor is). */
      .marks { position: absolute; top: 0; left: 0; display: block; box-sizing: border-box; width: 64px; height: 64px; padding: 4px; overflow: visible; pointer-events: none; }

      /* On: the tutor has hopped out to the cursor; this one stays faded with a soft glow behind it
         (hidden: fading out). */
      .stage::before {
        content: ""; position: absolute; left: 6px; top: 7px; width: 52px; height: 52px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(114, 50, 224, .42), rgba(114, 50, 224, 0));
        opacity: 0; transition: opacity .2s ease;
      }
      body.on .stage::before, body.reading .stage::before { opacity: 1; }
      body.on .face-tutor, body.reading .face-tutor { opacity: .55; }
      body.hidden .face-tutor { opacity: 0; transform: scale(.4) translateY(-10px); }
      /* Blocked: screen reading is off. */
      .alert { opacity: 0; transition: opacity .2s ease; }
      body.blocked .alert { opacity: 1; }
      body.hidden .blob { opacity: 0; transition: opacity .12s ease; }

      /* Shown: it pops up. */
      body.pop .stage { animation: pop .32s cubic-bezier(.2, .9, .3, 1.25); }
      @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      /* Moods: one at a time (body data-mood, picked by the script at the end), each the tutor's own
         face and move (its data-tut-feel: a giggle wriggles, love sends up its own hearts). Its idle
         face is its everyday one; now and then it smiles, winks, giggles, or loves; over it, it
         giggles; carried about, it is surprised; set down, it loves. A giggle and a wink also get
         the blob's little sparkle. */
      .pop-heart { opacity: 0; transform-box: fill-box; transform-origin: center; }
      body[data-mood="giggle"] .s1, body[data-mood="wink"] .s1 { animation: twinkle 1s ease-out; }
      @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 40% { opacity: 1; transform: scale(1.1) rotate(30deg); } }
      body.on .pop-heart, body.reading .pop-heart, body.hidden .pop-heart { display: none; }

      .label {
        position: absolute; top: 50%; display: none; max-width: 212px; padding: 7px 11px; border-radius: 10px;
        background: #1e1e1e; color: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); transform: translateY(-50%);
        pointer-events: none;
      }
      body.side-left .label { display: block; right: 72px; }
      body.side-right .label { display: block; left: 72px; }

      /* The tutors' own stylesheet, from the web app (scripts/static-tutors.mjs). */
      /* blob-tutor:start */
/* src/components/guide/tutorCharacters.css (web) */
/* ---------------------------------------------------------------------------
   Teach mode's tutor characters (components/guide/TutorCharacter.tsx; the drawings
   are in lib/guide/avatarArt.ts). Every class and keyframe starts with tut-: the old
   badge looks' av-* classes are still animated by index.css, and Tailwind owns names
   like .shadow. Only transform and opacity ever move, nothing is filtered, and each
   moving part turns on a pivot named in user units (transform-box: view-box), so a
   part never drifts while its neighbours move.

   3D since 2026-11-17 (the founder: "can you make them 3d? instead of a static 2d", then
   "add more coloring to those character, make it more accurate on all edges"): every
   filled part is a lit volume, a radial gradient from a highlight at its upper left
   through its colour to a shadow at its lower right, edged with a crisp line in a deep
   shade of its own colour; white parts take their shadow from the tutor's colour; the
   eyes are glossy beads, the cheeks a soft blush, the shadow on the ground soft. The
   gradients and the edge colours are worked out per tutor colour and written into each
   copy's markup as fill and stroke attributes (avatarArt.ts tutorShades, shadeFigure,
   shadingDefs; TutorCharacter.tsx), so this sheet never colours a filled part: a rule
   here would outrank the attribute. And the figure turns a little in depth towards
   where it glances (tut-turn, on a box of its own, in time with tut-look).

   Light to run (2026-10-08). The compositor can't run an animation on a part inside an
   SVG, so the old smooth loops in there repainted and re-layered the whole page on
   every frame: 120-170 ms of main thread a second in the reader. So:
     - the whole figure's moves (breathing, the talking bob, the arrival hops, the
       shadow's squash, the listening lean) are on HTML boxes round the SVG, which the
       compositor runs with no work for the page. Their distances are in % of the box,
       so they scale with the character as the 64-box's units did (1 unit = 1.5625%);
     - the small parts inside the SVG (blinks, glances, the mouth, the habits, flaps
       and waves) step through a few held poses: steps(1) shows each keyframe as it is
       until the next one, so the page repaints only when a pose changes - the mouth at
       most 8 times a second, a blink twice - not 60 times a second;
     - the sticker edge keeps still, but where its outline moves;
     - nothing runs while the pointer is hidden, and while it flies only the mouth does.
--------------------------------------------------------------------------- */
.tut-char {
  /* the rim round the figure on a dark page, and its shadow on the ground (the centre of a
     soft gradient, TutorCharacter's) */
  --tut-edge: rgba(255, 255, 255, 0.14);
  --tut-ground: rgba(36, 22, 54, 0.34);
  display: inline-block;
  flex-shrink: 0;
  line-height: 0;
  vertical-align: middle;
}
.dark .tut-char {
  --tut-edge: rgba(255, 255, 255, 0.14);
  --tut-ground: rgba(0, 0, 0, 0.62);
}
.tut-char svg {
  display: block;
  overflow: visible;
}
/* The boxes round the drawing fill the character's box, so a % of theirs is a % of the 64-box. */
.tut-char .tut-lean,
.tut-char .tut-hop,
.tut-char .tut-turn,
.tut-char .tut-bob,
.tut-char .tut-breathe {
  display: block;
  width: 100%;
  height: 100%;
}
.tut-char .tut-lean {
  position: relative;
  /* leans from its feet while it listens */
  transform-origin: 50% 92%;
  transition: transform 0.3s ease;
}
/* The shadow lies under the figure, beside the hop rather than in it, so it stays on the
   ground; TutorCharacter puts its pivot on the shadow's centre. */
.tut-char .tut-ground {
  position: absolute;
  left: 0;
  top: 0;
}
/* The figure's own moves turn on its feet, (32, 60) in the 64-box. Each is on a box of
   its own (arrival hop > talking bob > breathing), so one never restarts another; the
   hop comes after the shadow, so it is drawn over it. No will-change: a running
   transform animation is on the compositor anyway, and the hint would hold each box's
   picture at the scale it was drawn at mid-move, so a figure that stops moving (the
   dock's face once it has talked, as it doesn't breathe) would stay soft on a 100%
   screen for the rest of the session. */
.tut-char .tut-hop,
.tut-char .tut-turn,
.tut-char .tut-bob,
.tut-char .tut-breathe {
  transform-origin: 50% 93.75%;
}
/* the turn is seen from about three of the character's heights away (--tut-persp,
   TutorCharacter's), so it turns as much at 24 px as at 96 */
.tut-char .tut-hop { position: relative; perspective: var(--tut-persp, 150px); }
/* At 28 px and below only the face shows (TutorCharacter crops the viewBox). */
.tut-char[data-optical="xs"] .tut-breathe > svg { overflow: hidden; }
.tut-char svg * { transform-box: view-box; }

/* ---- paint: the edges' widths and the lines that are lines; a filled part's fill and edge
   colour are attributes (see above). The hatching and the heavy weight line were a pen
   drawing's shading: the gradients do that now. ---- */
.tut-char .tut-k,
.tut-char .tut-kt { stroke-linecap: round; stroke-linejoin: round; }
.tut-char .tut-k { stroke-width: 1.2; }
.tut-char .tut-kt { stroke-width: 0.9; }
.tut-char .tut-kx,
.tut-char .tut-kw { display: none; }
.tut-char .tut-nf { fill: none; }
/* limbs, Pip's crest and legs: a cord in a deep shade of the tutor's colour (--tut-limb);
   Sprout's stem in the leaves' green */
.tut-char .tut-k.tut-nf { stroke: var(--tut-limb); stroke-width: 2.4; }
.tut-char .tut-k.tut-stem { stroke: #2f7d33; }
/* fine lines: a closed eye, the spectacles, a brow, a smile, the spine's bands */
.tut-char .tut-kt.tut-nf { stroke: #241a22; stroke-width: 1.45; }
/* the catchlights, and the lenses: a glint of glass */
.tut-char .tut-fh { fill: #ffffff; }
.tut-char .tut-glass { fill: #ffffff; opacity: 0.35; }

/* ---- drawn for its size: firmer edges and lines, bigger eyes, up to 56 px ---- */
.tut-char:not([data-optical="md"]) .tut-k { stroke-width: 1.45; }
.tut-char:not([data-optical="md"]) .tut-kt { stroke-width: 1.1; }
.tut-char:not([data-optical="md"]) .tut-k.tut-nf { stroke-width: 2.9; }
.tut-char:not([data-optical="md"]) .tut-kt.tut-nf { stroke-width: 1.85; }
.tut-char:not([data-optical="md"]) .tut-bead { transform: scale(1.3); }
.tut-char[data-optical="xs"] .tut-k { stroke-width: 1.8; }
.tut-char[data-optical="xs"] .tut-bead { transform: scale(1.42); }

/* ---- the rim: the figure again, underneath, as one line just outside its edge. On a light
   page there is none (the edges and the shadow hold the figure); on a dark one a faint
   light rim keeps its deep shades from sinking into the page. ---- */
.tut-char .tut-edge { display: none; }
.dark .tut-char .tut-edge { display: inline; }
.tut-char .tut-edge * {
  fill: none !important;
  stroke: var(--tut-edge) !important;
  stroke-width: 3 !important;
  stroke-linecap: round !important;
  stroke-linejoin: round !important;
}
/* the inside of the figure never shows through, so its details need no edge */
.tut-char .tut-edge .tut-look,
.tut-char .tut-edge .tut-mouth,
.tut-char .tut-edge .tut-jaw,
.tut-char .tut-edge .tut-jaw-up,
.tut-char .tut-edge .tut-specs,
.tut-char .tut-edge .tut-kx,
.tut-char .tut-edge .tut-fw,
.tut-char .tut-edge .tut-fc,
.tut-char .tut-edge .tut-fh { display: none; }
.tut-char[data-optical="xs"] .tut-edge * { stroke-width: 3.6 !important; }
/* The edge keeps still, but for the parts that move its outline, which step through the
   same poses at the same moments as the figure's, so the paper always follows the ink:
   Pip's tail and wings, Nib's tilt (it is the whole pencil), Bramble's quills (they are
   its outline), Sprout's leaves, Comet's mane, Mochi's ear, and every wave. */
.tut-char .tut-edge *:not(.tut-tail, .tut-wing-l, .tut-wing-r, .tut-tilt, .tut-quills, .tut-flutter-l, .tut-flutter-r, .tut-leaf-l, .tut-leaf-r, .tut-mane, .tut-ear, .tut-wave) {
  animation: none !important;
}

/* ---- the rig: the parts inside the drawing ---- */
.tut-char .tut-tilt { transform-origin: 32px 60px; }
.tut-char .tut-mouth { transform: scaleY(0.32); }
.tut-char .tut-lid { opacity: 0; }

/* ---- idle: breathing, blinks (the open eye swaps for a closed lid), a look round, a habit ---- */
.tut-char .tut-breathe { animation: tut-breathe 3.6s ease-in-out var(--tut-d, 0s) infinite; }
.tut-char .tut-eyes { animation: tut-blink 7s steps(1) var(--tut-d, 0s) infinite; }
.tut-char .tut-lid { animation: tut-lid 7s steps(1) var(--tut-d, 0s) infinite; }
.tut-char .tut-look { animation: tut-look 12s steps(1) var(--tut-d, 0s) infinite; }
/* the figure turns towards where it glances: the same 12 s and the same start as tut-look,
   and it waits, stops and starts again whenever tut-look does, so the two never drift */
.tut-char .tut-turn { animation: tut-turn 12s ease-in-out var(--tut-d, 0s) infinite; }
.tut-char .tut-tail { animation: tut-tail 6.4s steps(1) var(--tut-d, 0s) infinite; }
.tut-char .tut-tilt { animation: tut-tilt 8s steps(1) var(--tut-d, 0s) infinite; }
.tut-char .tut-quills { animation: tut-ruffle 9s steps(1) var(--tut-d, 0s) infinite; }
.tut-char .tut-specs { animation: tut-specs 8.5s steps(1) var(--tut-d, 0s) infinite; }
/* both leaves sway together, as they always did (the right one's old "reverse" played the
   same symmetric sway; with held poses it would put them a pose apart) */
.tut-char .tut-leaf-l,
.tut-char .tut-leaf-r { animation: tut-sway 3.6s steps(1) var(--tut-d, 0s) infinite; }
/* Comet's mane sways as Sprout's leaves do, a little slower; Mochi's ear twitches as Pip's tail
   flicks */
.tut-char .tut-mane { animation: tut-sway 4.2s steps(1) var(--tut-d, 0s) infinite; }
.tut-char .tut-ear { animation: tut-tail 7.4s steps(1) var(--tut-d, 0s) infinite; }
/* The dock's 20 px face: just the blinks and the mouth (the rest would be a pixel's worth). */
.tut-char[data-optical="xs"] .tut-breathe,
.tut-char[data-optical="xs"] .tut-look,
.tut-char[data-optical="xs"] .tut-turn,
.tut-char[data-optical="xs"] .tut-tail,
.tut-char[data-optical="xs"] .tut-tilt,
.tut-char[data-optical="xs"] .tut-quills,
.tut-char[data-optical="xs"] .tut-specs,
.tut-char[data-optical="xs"] .tut-leaf-l,
.tut-char[data-optical="xs"] .tut-leaf-r,
.tut-char[data-optical="xs"] .tut-mane,
.tut-char[data-optical="xs"] .tut-ear { animation: none; }

/* ---- talking: uneven syllables and a bob (the breathing carries on underneath). The mouth,
   the beak and the leaves change pose together, at the same moments, so the page repaints
   at most 8 times a second for all of them. ---- */
.tut-char[data-tut-mood="talking"] .tut-bob { animation: tut-talkbob 0.46s ease-in-out infinite alternate; }
.tut-char[data-tut-mood="talking"] .tut-mouth { animation: tut-talk 0.92s steps(1) infinite; }
.tut-char[data-tut-mood="talking"] .tut-jaw { animation: tut-jaw 0.92s steps(1) infinite; }
.tut-char[data-tut-mood="talking"] .tut-jaw-up { animation: tut-jaw-up 0.92s steps(1) infinite; }
.tut-char[data-tut-mood="talking"] .tut-flutter-l { animation: tut-flutter-l 0.92s steps(1) infinite; }
.tut-char[data-tut-mood="talking"] .tut-flutter-r { animation: tut-flutter-r 0.92s steps(1) infinite; }

/* ---- listening: leans in, blinks slower, looks down towards the mic's card ---- */
.tut-char[data-tut-mood="listening"] > .tut-lean { transform: rotate(-6deg); }
.tut-char[data-tut-mood="listening"] .tut-eyes,
.tut-char[data-tut-mood="listening"] .tut-lid { animation-duration: 10s; }
.tut-char[data-tut-mood="listening"] .tut-look { animation: none; transform: translate(1.2px, 0.9px); }
.tut-char[data-tut-mood="listening"] .tut-turn { animation: none; transform: rotateY(10deg); }

/* ---- thinking: looks up and away, breathing slower ---- */
.tut-char[data-tut-mood="thinking"] .tut-look { animation: none; transform: translate(-1.3px, -1.1px); }
.tut-char[data-tut-mood="thinking"] .tut-turn { animation: none; transform: rotateY(-10deg); }
.tut-char[data-tut-mood="thinking"] .tut-breathe { animation-duration: 5.6s; }

/* ---- arriving (GuidePointer sets data-pointing for a moment): each its own entrance ---- */
.tut-char[data-pointing] .tut-ground { animation: tut-shadow-hop 0.66s cubic-bezier(0.3, 0.7, 0.4, 1) both; }
.tut-char[data-pointing] .tut-look { animation: tut-glance 1.5s steps(1) both; }
.tut-char[data-pointing] .tut-turn { animation: tut-turn-glance 1.5s ease-in-out both; }
.tut-char[data-look="pip"][data-pointing] .tut-hop,
.tut-char[data-look="sprout"][data-pointing] .tut-hop,
.tut-char[data-look="comet"][data-pointing] .tut-hop { animation: tut-hop 0.66s cubic-bezier(0.3, 0.7, 0.4, 1) both; }
.tut-char[data-look="bramble"][data-pointing] .tut-hop,
.tut-char[data-look="mochi"][data-pointing] .tut-hop { animation: tut-hop-small 0.6s cubic-bezier(0.3, 0.7, 0.4, 1) both; }
.tut-char[data-look="folio"][data-pointing] .tut-hop { animation: tut-hop-tilt 0.72s cubic-bezier(0.3, 0.8, 0.4, 1) both; }
.tut-char[data-look="nib"][data-pointing] .tut-hop { animation: tut-dash 0.9s cubic-bezier(0.3, 0.8, 0.4, 1) both; }
.tut-char[data-look="nib"][data-pointing] .tut-ground { animation: tut-shadow-dash 0.9s cubic-bezier(0.3, 0.8, 0.4, 1) both; }
.tut-char[data-look="bramble"][data-pointing] .tut-quills { animation: tut-puff 0.75s steps(1) both; }
.tut-char[data-look="pip"][data-pointing] .tut-wing-l { animation: tut-flap-l 0.62s steps(1) both; }
.tut-char[data-look="pip"][data-pointing] .tut-wing-r { animation: tut-flap-r 0.62s steps(1) both; }
.tut-char[data-look="sprout"][data-pointing] .tut-flutter-l { animation: tut-spring-l 0.8s steps(1) both; }
.tut-char[data-look="sprout"][data-pointing] .tut-flutter-r { animation: tut-spring-r 0.8s steps(1) both; }
.tut-char[data-look="comet"][data-pointing] .tut-mane { animation: tut-spring-l 0.8s steps(1) both; }
.tut-char[data-look="mochi"][data-pointing] .tut-ear { animation: tut-spring-r 0.8s steps(1) both; }
/* "wave": the move had no click of its own, so the character waves instead */
.tut-char[data-pointing="wave"] .tut-wave { animation: tut-wave 1.25s steps(1) 0.12s both; }

/* ---- the whole figure's moves (HTML boxes, run by the compositor; distances in % of the box) ---- */
/* a turn to the side it looks to (tut-look: left from 32%, right from 47%, ahead from 60%) */
@keyframes tut-turn {
  0%, 28%, 63.5%, 100% { transform: rotateY(0deg); }
  32%, 44.5% { transform: rotateY(-14deg); }
  46.25% { transform: rotateY(0deg); }
  49.5%, 59% { transform: rotateY(14deg); }
}
@keyframes tut-turn-glance { 0%, 100% { transform: rotateY(0deg); } 12%, 82% { transform: rotateY(-9deg); } }
@keyframes tut-breathe { 0%, 100% { transform: scale(1, 1); } 45% { transform: scale(0.988, 1.026); } }
@keyframes tut-talkbob { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-2.03125%) scale(0.985, 1.025); } }
@keyframes tut-hop {
  0% { transform: translateY(0) scale(1, 1); }
  16% { transform: translateY(0.78125%) scale(1.07, 0.9); }
  42% { transform: translateY(-10.9375%) scale(0.95, 1.07); }
  68% { transform: translateY(0) scale(1.08, 0.9); }
  84% { transform: translateY(0) scale(0.98, 1.03); }
  100% { transform: translateY(0) scale(1, 1); }
}
@keyframes tut-hop-small {
  0% { transform: translateY(0) scale(1, 1); }
  18% { transform: translateY(0.625%) scale(1.05, 0.93); }
  44% { transform: translateY(-6.25%) scale(0.97, 1.04); }
  70% { transform: translateY(0) scale(1.05, 0.94); }
  100% { transform: translateY(0) scale(1, 1); }
}
@keyframes tut-hop-tilt {
  0% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  16% { transform: translate(0, 0.78125%) rotate(0deg) scale(1.07, 0.91); }
  44% { transform: translate(0, -10.9375%) rotate(-9deg) scale(0.97, 1.04); }
  70% { transform: translate(0, 0) rotate(4deg) scale(1.05, 0.95); }
  86% { transform: translate(0, 0) rotate(-1.5deg) scale(1, 1); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
}
/* Nib darts towards the arrow's tip, overshoots, and taps the page twice like a pencil. */
@keyframes tut-dash {
  0% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  22% { transform: translate(-5.46875%, -3.90625%) rotate(-11deg) scale(1.03, 0.97); }
  40% { transform: translate(1.5625%, 0.9375%) rotate(3deg) scale(1, 1); }
  54% { transform: translate(0, 0) rotate(-7deg) scale(1, 1); }
  63% { transform: translate(0, 0.78125%) rotate(0deg) scale(1.02, 0.98); }
  74% { transform: translate(0, 0) rotate(-6deg) scale(1, 1); }
  84% { transform: translate(0, 0.625%) rotate(0deg) scale(1.02, 0.98); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
}
@keyframes tut-shadow-hop {
  0%, 100% { transform: scale(1); opacity: 1; }
  42% { transform: scale(0.6); opacity: 0.5; }
  68% { transform: scale(1.12); opacity: 1; }
}
@keyframes tut-shadow-dash {
  0%, 100% { transform: translateX(0) scale(1, 1); }
  22% { transform: translateX(-3.90625%) scale(1.06, 1); }
  40% { transform: translateX(1.25%) scale(1, 1); }
}

/* ---- the parts inside the drawing: held poses (steps(1)), each kept until the next ---- */
/* A blink every 7 s, and now and then two: the open eye swaps for the closed lid for
   ~130 ms (a scaled bead is all but invisible at 48 px; a closed lid reads), then opens. */
@keyframes tut-blink {
  0%, 40.9%, 89.6%, 93.6%, 100% { opacity: 1; }
  39%, 88%, 92% { opacity: 0; }
}
@keyframes tut-lid {
  0%, 40.9%, 89.6%, 93.6%, 100% { opacity: 0; }
  39%, 88%, 92% { opacity: 1; }
}
/* a look to one side, across (a beat in the middle), to the other side, and back */
@keyframes tut-look {
  0%, 45.5%, 60%, 100% { transform: translate(0, 0); }
  32% { transform: translate(-1.4px, 0.2px); }
  47% { transform: translate(1.4px, -0.3px); }
}
@keyframes tut-tail {
  0%, 91%, 100% { transform: rotate(0deg); }
  80% { transform: rotate(-9deg); }
  82% { transform: rotate(-16deg); }
  85.5% { transform: rotate(-4deg); }
  87.5% { transform: rotate(5deg); }
}
@keyframes tut-tilt {
  0%, 90%, 100% { transform: rotate(0deg); }
  67% { transform: rotate(-2deg); }
  70% { transform: rotate(-4deg); }
  84% { transform: rotate(-1deg); }
  86.5% { transform: rotate(1deg); }
}
@keyframes tut-ruffle {
  0%, 89%, 100% { transform: scale(1, 1); }
  81% { transform: scale(1.045, 1.035); }
  83.5% { transform: scale(0.99, 0.99); }
  86% { transform: scale(1.02, 1.02); }
}
@keyframes tut-specs {
  0%, 75%, 100% { transform: translateY(0); }
  59% { transform: translateY(-0.6px); }
  60.5% { transform: translateY(-1.1px); }
  73% { transform: translateY(-0.5px); }
}
@keyframes tut-sway {
  0%, 100% { transform: rotate(0deg); }
  25%, 75% { transform: rotate(1.75deg); }
  50% { transform: rotate(3.5deg); }
}

/* Talking: seven syllable poses in 0.92 s (7.6 a second), the beak and the leaves on the
   same beats as the mouth. */
@keyframes tut-talk {
  0%, 50%, 100% { transform: scaleY(0.3); }
  12%, 80% { transform: scaleY(1); }
  24% { transform: scaleY(0.5); }
  38% { transform: scaleY(0.9); }
  62% { transform: scaleY(0.72); }
}
@keyframes tut-jaw {
  0%, 50%, 100% { transform: translateY(0); }
  12%, 80% { transform: translateY(2.2px); }
  24% { transform: translateY(0.8px); }
  38%, 62% { transform: translateY(1.7px); }
}
@keyframes tut-jaw-up { 0%, 50%, 100% { transform: translateY(0); } 12%, 62% { transform: translateY(-0.6px); } }
@keyframes tut-flutter-l { 0%, 100% { transform: rotate(0deg); } 24%, 80% { transform: rotate(2.5deg); } 50% { transform: rotate(5deg); } }
@keyframes tut-flutter-r { 0%, 100% { transform: rotate(0deg); } 24%, 80% { transform: rotate(-2.5deg); } 50% { transform: rotate(-5deg); } }

/* Arriving: a glance, a puff, two flaps, a spring of the leaves, a wave - a few poses each. */
@keyframes tut-glance { 0%, 88%, 100% { transform: translate(0, 0); } 10% { transform: translate(-1.3px, -1px); } }
@keyframes tut-puff {
  0%, 86%, 100% { transform: scale(1, 1); }
  12% { transform: scale(1.14, 1.12); }
  40% { transform: scale(0.97, 0.98); }
  64% { transform: scale(1.04, 1.03); }
}
@keyframes tut-flap-l {
  0%, 88%, 100% { transform: rotate(0deg); }
  14% { transform: rotate(38deg); }
  42% { transform: rotate(8deg); }
  66% { transform: rotate(32deg); }
}
@keyframes tut-flap-r {
  0%, 88%, 100% { transform: rotate(0deg); }
  14% { transform: rotate(-38deg); }
  42% { transform: rotate(-8deg); }
  66% { transform: rotate(-32deg); }
}
@keyframes tut-spring-l {
  0%, 90%, 100% { transform: rotate(0deg); }
  12% { transform: rotate(10deg); }
  26% { transform: rotate(16deg); }
  50% { transform: rotate(-5deg); }
  72% { transform: rotate(4deg); }
}
@keyframes tut-spring-r {
  0%, 90%, 100% { transform: rotate(0deg); }
  12% { transform: rotate(-10deg); }
  26% { transform: rotate(-16deg); }
  50% { transform: rotate(5deg); }
  72% { transform: rotate(-4deg); }
}
/* up halfway, up, a wiggle, back, a wiggle, down halfway, down */
@keyframes tut-wave {
  0%, 92%, 100% { transform: rotate(0deg); }
  10%, 82% { transform: rotate(calc(var(--raise, -90deg) * 0.5)); }
  20%, 49% { transform: rotate(var(--raise, -90deg)); }
  31%, 67% { transform: rotate(calc(var(--raise, -90deg) + var(--wig, 24deg))); }
}

/* ---- reduced motion: calm. Slow blinks only, a gentle mouth so you can still see who is
   talking, and a wave is a still raised hand; nothing hops, bobs, breathes or sways. ---- */
@keyframes tut-talk-calm { 0%, 100% { transform: scaleY(0.32); } 25%, 75% { transform: scaleY(0.55); } 50% { transform: scaleY(0.75); } }
@keyframes tut-jaw-calm { 0%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(0.7px); } 50% { transform: translateY(1.4px); } }
@media (prefers-reduced-motion: reduce) {
  .tut-char .tut-breathe,
  .tut-char .tut-look,
  .tut-char .tut-turn,
  .tut-char .tut-tail,
  .tut-char .tut-tilt,
  .tut-char .tut-quills,
  .tut-char .tut-specs,
  .tut-char .tut-leaf-l,
  .tut-char .tut-leaf-r,
  .tut-char .tut-mane,
  .tut-char .tut-ear,
  .tut-char .tut-flutter-l,
  .tut-char .tut-flutter-r,
  .tut-char .tut-bob,
  .tut-char .tut-hop,
  .tut-char .tut-ground,
  .tut-char .tut-wing-l,
  .tut-char .tut-wing-r,
  .tut-char .tut-jaw-up,
  .tut-char .tut-wave,
  .tut-char .tut-tear,
  .tut-char .tut-sweat,
  .tut-char .tut-confetti { animation: none !important; }
  .tut-char .tut-fx { display: none; }
  .tut-char .tut-eyes,
  .tut-char .tut-lid { animation-duration: 10s; }
  .tut-char[data-tut-mood="talking"] .tut-mouth { animation: tut-talk-calm 1.6s steps(1) infinite; }
  .tut-char[data-tut-mood="talking"] .tut-jaw { animation: tut-jaw-calm 1.6s steps(1) infinite; }
  .tut-char[data-pointing="wave"] .tut-wave { transform: rotate(var(--raise, -90deg)); }
  .tut-char .tut-lean { transition: none; }
}

/* ---- unseen: nothing runs. GuidePointer fades the pointer out with Tailwind's opacity-0;
   while it flies (data-flying on the pointer, set by Teach mode) only the mouth and the
   figure's own moves go on: the glances and habits wait where they are, and so does the
   blink, with the open eye held over it (paused mid-blink it could fly shut). Waiting,
   not stopping, keeps the blink's place, so it carries on after landing: started afresh
   at each landing it would come back to the same point every time, and a pointer that
   moves every second or two would never blink. Its entrance on landing is never held,
   even while the pointer's moves go on (data-pointing). Matched by attribute, as both
   names are GuidePointer's and this sheet names only tut- classes. !important because
   the moods' and arrivals' animation shorthands would set the play state back to
   running, and only an important opacity outranks the one the blink sets. ---- */
[class~="guide-cursor"][class~="opacity-0"] .tut-char,
[class~="guide-cursor"][class~="opacity-0"] .tut-char * { animation-play-state: paused !important; }
[class~="guide-cursor"][data-flying] .tut-char:not([data-pointing]) :is(.tut-look, .tut-turn, .tut-tail, .tut-tilt, .tut-quills, .tut-specs, .tut-leaf-l, .tut-leaf-r, .tut-mane, .tut-ear) {
  animation-play-state: paused !important;
}
[class~="guide-cursor"][data-flying] .tut-char .tut-eyes { animation-play-state: paused !important; opacity: 1 !important; }
[class~="guide-cursor"][data-flying] .tut-char .tut-lid { animation-play-state: paused !important; opacity: 0 !important; }

/* ---- the sleepy moods (lib/guide/idleRest.ts WAKE_MOODS): the tutor popping out of Tutor me
   before the lesson's first word (one a day), and resting on the bench (IdleBench). The closed
   lid stands in for the open eye; each mood has a habit of its own. The whole figure's moves
   are on .tut-bob (free while it isn't talking), in % of the box, round its feet; the parts
   inside step through held poses, as every other mood's do. ---- */
.tut-char:is([data-tut-mood="sleepy"], [data-tut-mood="dreamy"], [data-tut-mood="yawn"]) .tut-eyes { animation: none; opacity: 0; }
.tut-char:is([data-tut-mood="sleepy"], [data-tut-mood="dreamy"], [data-tut-mood="yawn"]) .tut-lid { animation: none; opacity: 1; }
.tut-char:is([data-tut-mood="sleepy"], [data-tut-mood="dreamy"]) .tut-breathe { animation-duration: 6.4s; }
.tut-char:is([data-tut-mood="sleepy"], [data-tut-mood="dreamy"]) .tut-look { animation: none; transform: translate(0, 0.8px); }
/* sleepy: the head sinks slowly to one side and comes back */
.tut-char[data-tut-mood="sleepy"] .tut-bob { animation: tut-doze 6.4s ease-in-out infinite; }
/* dreamy: a slow sway */
.tut-char[data-tut-mood="dreamy"] .tut-bob { animation: tut-dream 7s ease-in-out infinite; }
/* yawn: every few seconds the mouth opens wide and the figure stretches up */
.tut-char[data-tut-mood="yawn"] .tut-mouth { animation: tut-yawn 4.2s steps(1) infinite; }
.tut-char[data-tut-mood="yawn"] .tut-bob { animation: tut-stretch 4.2s ease-in-out infinite; }
/* drowsy: heavy eyes, shut most of the time, a nod off and a jolt awake */
.tut-char[data-tut-mood="drowsy"] .tut-eyes { animation: tut-heavy-eyes 3.4s steps(1) infinite; }
.tut-char[data-tut-mood="drowsy"] .tut-lid { animation: tut-heavy-lid 3.4s steps(1) infinite; }
.tut-char[data-tut-mood="drowsy"] .tut-bob { animation: tut-nod 3.4s ease-in-out infinite; }
/* cozy: slow, contented blinks (the lid held long), breathing slow */
.tut-char[data-tut-mood="cozy"] .tut-eyes { animation: tut-heavy-eyes 5s steps(1) infinite; }
.tut-char[data-tut-mood="cozy"] .tut-lid { animation: tut-heavy-lid 5s steps(1) infinite; }
.tut-char[data-tut-mood="cozy"] .tut-breathe { animation-duration: 5.2s; }
@keyframes tut-doze {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(7deg) translateY(2%); }
}
@keyframes tut-dream {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}
@keyframes tut-yawn {
  0%, 100% { transform: scaleY(0.32); }
  58% { transform: scaleY(1.1); }
  66% { transform: scaleY(1.9); }
  84% { transform: scaleY(1.1); }
  90% { transform: scaleY(0.32); }
}
@keyframes tut-stretch {
  0%, 55%, 100% { transform: scale(1, 1); }
  70%, 80% { transform: scale(0.96, 1.06); }
}
@keyframes tut-heavy-eyes {
  0% { opacity: 1; }
  19%, 100% { opacity: 0; }
}
@keyframes tut-heavy-lid {
  0% { opacity: 0; }
  19%, 100% { opacity: 1; }
}
@keyframes tut-nod {
  0%, 20% { transform: rotate(0deg); }
  70% { transform: rotate(10deg) translateY(3%); }
  76%, 100% { transform: rotate(0deg); }
}
@media (prefers-reduced-motion: reduce) {
  .tut-char:is([data-tut-mood="sleepy"], [data-tut-mood="dreamy"], [data-tut-mood="yawn"], [data-tut-mood="drowsy"]) .tut-bob { animation: none; }
  .tut-char[data-tut-mood="yawn"] .tut-mouth { animation: none; }
}

/* ---- feelings (lib/guide/tutorFeelings.ts; TutorCharacter sets data-tut-feel, and
   data-tut-move for its own small moves when idle). The same on all seven: faces drawn over
   their own (avatarArt faceOverlay: tut-joy, tut-brows, tut-smile, tut-grin, tut-frown,
   tut-wobble, tut-tear, tut-sweat), hidden until a feeling shows one; the whole figure's moves
   on .tut-hop (a box: transform only, % of the box, run by the compositor); the tear and the
   sweat drop step through held poses, as every part inside the drawing does. While it talks
   its own mouth keeps talking and only the eyes change. ---- */
.tut-char .tut-face > * { opacity: 0; }
.tut-char .tut-drop { fill: #8fd0f4; }

/* happy, excited, celebrate, giggle: eyes squeezed into happy arcs, rosy cheeks */
.tut-char:is([data-tut-feel="happy"], [data-tut-feel="excited"], [data-tut-feel="celebrate"], [data-tut-feel="giggle"]) .tut-look { opacity: 0; }
.tut-char:is([data-tut-feel="happy"], [data-tut-feel="excited"], [data-tut-feel="celebrate"], [data-tut-feel="giggle"]) .tut-joy { opacity: 1; }
.tut-char:is([data-tut-feel="happy"], [data-tut-feel="excited"], [data-tut-feel="celebrate"], [data-tut-feel="giggle"]) .tut-fc { opacity: 0.95; }
/* its own mouth makes way for the feeling's, unless it is talking */
.tut-char[data-tut-feel]:not([data-tut-mood="talking"]) .tut-mouth { opacity: 0; }
.tut-char[data-tut-feel="happy"]:not([data-tut-mood="talking"]) .tut-smile { opacity: 1; }
.tut-char:is([data-tut-feel="excited"], [data-tut-feel="celebrate"], [data-tut-feel="giggle"]):not([data-tut-mood="talking"]) .tut-grin { opacity: 1; }
/* Pip has no mouth to swap: its beak opens in a grin */
.tut-char:is([data-tut-feel="excited"], [data-tut-feel="celebrate"], [data-tut-feel="giggle"]):not([data-tut-mood="talking"]) .tut-jaw { transform: translateY(1.4px); }

/* sad: brows up, eyes down, a frown, a tear rolling; it droops */
.tut-char:is([data-tut-feel="sad"], [data-tut-feel="guilty"]) .tut-brows { opacity: 1; }
.tut-char[data-tut-feel="sad"] .tut-look { animation: none; transform: translate(0, 1px); }
.tut-char[data-tut-feel="sad"]:not([data-tut-mood="talking"]) .tut-frown { opacity: 1; }
.tut-char[data-tut-feel="sad"] .tut-tear { opacity: 1; animation: tut-tear 2s steps(1) infinite; }
.tut-char[data-tut-feel="sad"] .tut-fc { opacity: 0; }
.tut-char[data-tut-feel="sad"] > .tut-lean { transform: translateY(2.5%) scale(1.03, 0.95); }
.tut-char[data-tut-feel="sad"] .tut-breathe { animation-duration: 5.4s; }

/* guilty: looks away and down, a wobbly mouth, a sweat drop, shifts from foot to foot */
.tut-char[data-tut-feel="guilty"] .tut-look { animation: none; transform: translate(-1.4px, 0.9px); }
.tut-char[data-tut-feel="guilty"]:not([data-tut-mood="talking"]) .tut-wobble { opacity: 1; }
.tut-char[data-tut-feel="guilty"] .tut-sweat { opacity: 1; animation: tut-sweat 2.4s steps(1) infinite; }
.tut-char[data-tut-feel="guilty"] > .tut-lean { transform: rotate(4deg) scale(0.97); }
.tut-char[data-tut-feel="guilty"] .tut-hop { animation: tut-shuffle 1.6s ease-in-out infinite; }

/* the whole figure's moves (.tut-char doubled: a feeling outranks an arrival's hop, which
   would otherwise put the body and its shadow out of step) */
.tut-char.tut-char[data-tut-feel="happy"] .tut-hop,
.tut-char.tut-char[data-tut-move="jump"] .tut-hop { animation: tut-jump 0.75s cubic-bezier(0.3, 0.7, 0.4, 1) both; }
.tut-char.tut-char[data-tut-feel="happy"] .tut-ground,
.tut-char.tut-char[data-tut-move="jump"] .tut-ground { animation: tut-shadow-jump 0.75s cubic-bezier(0.3, 0.7, 0.4, 1) both; }
.tut-char.tut-char[data-tut-feel="excited"] .tut-hop { animation: tut-bounce 0.42s ease-in-out infinite alternate; }
.tut-char.tut-char[data-tut-feel="excited"] .tut-ground { animation: tut-shadow-bounce 0.42s ease-in-out infinite alternate; }
.tut-char.tut-char[data-tut-feel="celebrate"] .tut-hop { animation: tut-flip 1.15s cubic-bezier(0.35, 0.6, 0.35, 1) both, tut-bounce 0.42s ease-in-out 1.2s infinite alternate; }
.tut-char.tut-char[data-tut-feel="celebrate"] .tut-ground { animation: tut-shadow-flip 1.15s ease-in-out both, tut-shadow-bounce 0.42s ease-in-out 1.2s infinite alternate; }
.tut-char.tut-char[data-tut-move="flip"] .tut-hop { animation: tut-flip 1.15s cubic-bezier(0.35, 0.6, 0.35, 1) both; }
.tut-char.tut-char[data-tut-move="flip"] .tut-ground { animation: tut-shadow-flip 1.15s ease-in-out both; }
.tut-char.tut-char[data-tut-move="side"] .tut-hop { animation: tut-side 1.45s ease-in-out both; }
.tut-char.tut-char[data-tut-feel="giggle"] .tut-hop { animation: tut-giggle 0.36s ease-in-out infinite alternate; }
/* the dock's 20 px face only changes its face: a move would leave its button */
.tut-char.tut-char.tut-char[data-optical="xs"] .tut-hop { animation: none; }

/* a celebration's confetti: each piece on a box the size of the figure, turned to its own
   direction (TutorCharacter), flies up out of it and fades */
.tut-char .tut-fx { position: absolute; inset: 0; pointer-events: none; }
.tut-char .tut-spark { position: absolute; inset: 0; transform-origin: 50% 55%; }
.tut-char .tut-confetti {
  position: absolute;
  left: 47%;
  top: 40%;
  width: 7%;
  height: 11%;
  border-radius: 1px;
  background: #f5b335;
  opacity: 0;
  animation: tut-confetti 1.3s cubic-bezier(0.2, 0.8, 0.4, 1) 0.45s both;
}
.tut-char .tut-spark:nth-child(4n + 2) .tut-confetti { background: #e2574c; animation-delay: 0.5s; }
.tut-char .tut-spark:nth-child(4n + 3) .tut-confetti { background: #73ad60; animation-delay: 0.55s; }
.tut-char .tut-spark:nth-child(4n) .tut-confetti { background: #7aa7f0; animation-delay: 0.6s; border-radius: 50%; }

@keyframes tut-jump {
  0% { transform: translateY(0) scale(1, 1); }
  15% { transform: translateY(0.78125%) scale(1.09, 0.88); }
  45% { transform: translateY(-21.875%) scale(0.94, 1.08); }
  72% { transform: translateY(0) scale(1.1, 0.88); }
  86% { transform: translateY(0) scale(0.97, 1.04); }
  100% { transform: translateY(0) scale(1, 1); }
}
@keyframes tut-shadow-jump {
  0%, 100% { transform: scale(1); opacity: 1; }
  45% { transform: scale(0.5); opacity: 0.4; }
  72% { transform: scale(1.15); opacity: 1; }
}
@keyframes tut-bounce {
  from { transform: translateY(0) scale(1.05, 0.94); }
  to { transform: translateY(-12.5%) scale(0.97, 1.04); }
}
@keyframes tut-shadow-bounce {
  from { transform: scale(1.08); opacity: 1; }
  to { transform: scale(0.7); opacity: 0.55; }
}
/* A backflip round its middle: the box turns on its feet, so it is lifted to its middle, turned
   and set back down (the same five steps in every frame, so each is eased on its own). */
@keyframes tut-flip {
  0% { transform: translateY(0) translateY(-43.75%) rotate(0deg) translateY(43.75%) scale(1, 1); }
  16% { transform: translateY(1.5625%) translateY(-43.75%) rotate(0deg) translateY(43.75%) scale(1.1, 0.86); }
  36% { transform: translateY(-34%) translateY(-43.75%) rotate(-130deg) translateY(43.75%) scale(0.95, 1.05); }
  56% { transform: translateY(-36%) translateY(-43.75%) rotate(-250deg) translateY(43.75%) scale(0.95, 1.05); }
  78% { transform: translateY(-4%) translateY(-43.75%) rotate(-352deg) translateY(43.75%) scale(1, 1); }
  88% { transform: translateY(0) translateY(-43.75%) rotate(-360deg) translateY(43.75%) scale(1.1, 0.88); }
  100% { transform: translateY(0) translateY(-43.75%) rotate(-360deg) translateY(43.75%) scale(1, 1); }
}
@keyframes tut-shadow-flip {
  0%, 100% { transform: scale(1); opacity: 1; }
  16% { transform: scale(1.12); opacity: 1; }
  45% { transform: scale(0.45); opacity: 0.35; }
  88% { transform: scale(1.15); opacity: 1; }
}
/* two little hops to one side, two back */
@keyframes tut-side {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  12% { transform: translate(-7%, -7%) rotate(-6deg); }
  24% { transform: translate(-14%, 0) rotate(0deg); }

      <!-- blob-tutor:end -->
    <script>
      (function () {
        var body = document.body;
        var root = document.documentElement;
        var blob = document.getElementById("blob");
        var label = document.getElementById("label");
        var face = document.getElementById("tutor");
        var LOOKS = ["resting", "on", "reading", "blocked", "hidden"];
        // Each mood's face, the tutor's own (its data-tut-feel; none: its idle face).
        var FEELS = { happy: "", smile: "happy", wink: "wink", giggle: "giggle", love: "love", wee: "surprised" };
        var down = false;
        var hovering = false;
        var tutor = null;
        var shown = "";
        var feeling = "";

        // Its face now: the mood's, or curious while a window is read. `again`: its move starts over
        // (a new mood, even with the same face).
        function feel(again) {
          var mood = body.getAttribute("data-mood") || "happy";
          feeling = body.classList.contains("reading") ? "curious" : FEELS[mood] || "";
          if (!tutor) return;
          if (again) {
            tutor.removeAttribute("data-tut-feel");
            void tutor.offsetWidth;
          }
          if (feeling) tutor.setAttribute("data-tut-feel", feeling);
          else tutor.removeAttribute("data-tut-feel");
        }

        // The tutor: a copy of the template main names (blob:state tutor, "look:colour"), found by
        // that exact name. Nothing else ever goes into the page. A name with no copy keeps the
        // tutor shown.
        function showTutor(key) {
          if (typeof key !== "string" || key === shown) return;
          var copies = document.querySelectorAll("template[data-tutor]");
          var copy = null;
          for (var i = 0; i < copies.length; i++) {
            if (copies[i].getAttribute("data-tutor") === key) copy = copies[i];
          }
          if (!copy) return;
          face.replaceChildren(copy.content.cloneNode(true));
          shown = key;
          tutor = face.querySelector(".tut-char");
          feel();
        }

        // Dark as the app is (the tutor gets the light rim it has on a dark page); until main
        // says, as the system is.
        function setDark(dark) {
          root.classList.toggle("dark", dark === true);
        }
        setDark(Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));

        // Until main says: a new student's tutor (the copy marked data-default).
        var first = document.querySelector("template[data-default]");
        if (first) showTutor(first.getAttribute("data-tutor"));

        var bridge = window.screenBlob;
        if (!bridge) return;
        // (with the app: shown once main has said, so no other tutor flashes by first)
        body.classList.add("waiting");

        // Its moods: one at a time, back to its everyday face after `ms`.
        var back;
        function setMood(mood, ms) {
          body.removeAttribute("data-mood");
          void body.offsetWidth;
          body.setAttribute("data-mood", mood);
          feel(true);
          clearTimeout(back);
          if (ms) back = setTimeout(function () { setMood("happy"); }, ms);
        }
        function giggle() { setMood("giggle", 1300); }
        // Now and then, left alone: a smile, a wink, a giggle, or a heart.
        var MOODS = [["smile", 4200], ["wink", 2200], ["giggle", 1300], ["love", 2000], ["smile", 4200]];
        (function wander() {
          setTimeout(function () {
            if (!down && !hovering && body.classList.contains("resting")) {
              var pick = MOODS[Math.floor(Math.random() * MOODS.length)];
              setMood(pick[0], pick[1]);
            }
            wander();
          }, 6000 + Math.random() * 7000);
        })();
        setMood("happy");

        // Landing back home (or shown): it waves, as the lesson's pointer does arriving (the web
        // app's tutorCharacters.css, data-pointing="wave"), with a smile.
        var waving;
        function wave() {
          var t = tutor;
          if (!t) return;
          t.setAttribute("data-pointing", "wave");
          clearTimeout(waving);
          waving = setTimeout(function () { t.removeAttribute("data-pointing"); }, 1400);
          setMood("smile", 1400);
        }

        bridge.onState(function (state) {
          if (!state) return;
          body.classList.remove("waiting");
          LOOKS.forEach(function (look) { body.classList.toggle(look, state.look === look); });
          body.classList.toggle("side-left", state.side === "left");
          body.classList.toggle("side-right", state.side === "right");
          if (typeof state.label === "string") {
            label.textContent = state.label;
            blob.setAttribute("aria-label", state.label);
          }
          if (typeof state.dark === "boolean") setDark(state.dark);
          showTutor(state.tutor);
          feel();
          if (state.pop) {
            body.classList.remove("pop");
            void body.offsetWidth;
            body.classList.add("pop");
            wave();
          }
        });

        // The bubble pop as the tutor hops out and lands back (companion.ts popSound, which keeps to
        // the Sounds switch). Quiet, as every interface sound is.
        var pop = new Audio("sounds/bubble_pop.mp3");
        pop.preload = "auto";
        pop.volume = 0.6;
        if (bridge.onSound) bridge.onSound(function () {
          try {
            pop.currentTime = 0;
            var playing = pop.play();
            if (playing && playing.catch) playing.catch(function () {});
          } catch (e) {}
        });

        // The app moves the window while the button is down (a drag region would take the click
        // the blob needs), and decides on release whether it was a click or a drag.
        blob.addEventListener("pointerdown", function (e) {
          if (e.button !== 0 || e.ctrlKey) return;
          e.preventDefault();
          down = true;
          setMood("wee");
          try { blob.setPointerCapture(e.pointerId); } catch (_) { /* the release still comes */ }
          body.classList.add("held");
          bridge.dragStart();
        });
        function release() {
          if (!down) return;
          down = false;
          body.classList.remove("held");
          setMood("love", 2000);
          bridge.dragEnd();
        }
        blob.addEventListener("pointerup", release);
        blob.addEventListener("pointercancel", release);
        blob.addEventListener("lostpointercapture", release);
        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
          bridge.menu();
        });
        blob.addEventListener("mouseenter", function () {
          if (down) return;
          hovering = true;
          bridge.hover(true);
          giggle();
        });
        blob.addEventListener("mouseleave", function () {
          hovering = false;
          bridge.hover(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") bridge.toggle();
        });
      })();
    </script>
